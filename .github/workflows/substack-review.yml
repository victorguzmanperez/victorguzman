name: Validate Dataverso content

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Test Dataverso staging logic
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate reviewed Dataverso catalog
        run: node scripts/build_content.mjs --check

      - name: Run chatbot test suite
        run: node --test assets/chatbot/tests/*.mjs
