name: Stage public Dataverso articles
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s scripts/tests -v
      - run: node scripts/build_content.mjs --check
      - run: node --test assets/chatbot/tests/*.mjs
      - run: python scripts/sync_substack.py
      - uses: actions/upload-artifact@v4
        with:
          name: dataverso-pending-review
          path: content/staged/dataverso.json
          retention-days: 30
